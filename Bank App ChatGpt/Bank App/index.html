<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
    <div>
        <h1>Bank Account Manager</h1>
        <p>JavaScript Closure Based Banking Application</p>
    </div>
</header>

<main class="container">
    <section class="accounts">
        <div class="account-card">
            <div class="account-header">
                <div>
                    <span class="account-label">ACCOUNT</span>
                    <h2>User 1</h2>
                </div>
                <div class="account-icon">₹</div>
            </div>
            <div class="balance-section">
                <span>Current Balance</span>
                <h3 id="user1Balance">₹0.00</h3>
            </div>
            <div class="actions">
                <div class="input-group">
                    <label for="user1Amount">Amount</label>
                    <input type="number" id="user1Amount" placeholder="Enter amount" min="1">
                </div>
                <div class="button-group">
                    <button class="btn deposit" onclick="depositMoney(1)">Deposit</button>
                    <button class="btn withdraw" onclick="withdrawMoney(1)">Withdraw</button>
                </div>
            </div>
        </div>

        <div class="account-card">
            <div class="account-header">
                <div>
                    <span class="account-label">ACCOUNT</span>
                    <h2>User 2</h2>
                </div>
                <div class="account-icon">₹</div>
            </div>
            <div class="balance-section">
                <span>Current Balance</span>
                <h3 id="user2Balance">₹0.00</h3>
            </div>
            <div class="actions">
                <div class="input-group">
                    <label for="user2Amount">Amount</label>
                    <input type="number" id="user2Amount" placeholder="Enter amount" min="1">
                </div>
                <div class="button-group">
                    <button class="btn deposit" onclick="depositMoney(2)">Deposit</button>
                    <button class="btn withdraw" onclick="withdrawMoney(2)">Withdraw</button>
                </div>
            </div>
        </div>
    </section>

    <div id="message" class="message hidden"></div>

    <section class="transactions">
        <div class="section-title">
            <div>
                <h2>Transaction History</h2>
                <p>Recent account activities</p>
            </div>
            <button class="clear-btn" onclick="clearHistory()">Clear History</button>
        </div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Account</th>
                        <th>Transaction</th>
                        <th>Amount</th>
                        <th>Balance</th>
                        <th>Time</th>
                    </tr>
                </thead>
                <tbody id="transactionBody"></tbody>
            </table>
        </div>
    </section>
</main>

<footer>
    <p>Bank Account Manager • JavaScript Practice Project</p>
</footer>

<script src="script.js"></script>
</body>
</html>
